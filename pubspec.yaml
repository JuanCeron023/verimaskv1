name: verimask
description: Flutter Face Detection and Privacy Camera App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ML & Face Detection
  google_mlkit_face_detection: ^0.13.2

  # Camera
  camera: ^0.10.5+5
  path_provider: ^2.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Sharing
  share_plus: ^9.0.0

  # Cryptography & Hashing
  crypto: ^3.0.3
  pointycastle: ^3.9.1

  # Image processing (pure Dart)
  image: ^4.1.7

  # Preferences
  shared_preferences: ^2.2.2

  # Dependency Injection
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  generate: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/img/logonopalabras.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/img/logonopalabras.png"
